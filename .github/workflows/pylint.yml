name: Pylint Code Quality Check

on:
  # 推送到 v2 分支时自动执行代码质量检查
  push:
    branches:
      - v2
  # 允许手动触发
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    name: Pylint Code Quality Check

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements.in') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pylint
        # 安装项目依赖
        if [ -f requirements.txt ]; then
          echo "📦 安装 requirements.txt 中的依赖..."
          pip install -r requirements.txt
        elif [ -f requirements.in ]; then
          echo "📦 安装 requirements.in 中的依赖..."
          pip install -r requirements.in
        else
          echo "⚠️ 未找到依赖文件，仅安装 pylint"
        fi

    - name: Verify pylint config
      run: |
        # 检查项目中的pylint配置文件是否存在
        if [ -f .pylintrc ]; then
          echo "✅ 找到项目配置文件: .pylintrc"
          echo "配置文件内容预览:"
          head -10 .pylintrc
        else
          echo "❌ 未找到 .pylintrc 配置文件"
          exit 1
        fi
    - name: Run pylint
      # 非阻塞：仓库存在大量既有 E 级错误（含缺失的 app/helper/sites 模块），
      # 本步骤仅生成检查报告，不阻断构建；待既有问题修复后应移除 continue-on-error
      # 与命令后的 || true，恢复质量门禁
      continue-on-error: true
      run: |
        # 运行pylint，检查主要的Python文件（报告模式）
        echo "🚀 运行 Pylint 错误检查（报告模式）..."

        # 检查主要目录 - 只关注错误
        # （--fail-on=E：警告和评分不导致失败；--fail-under=0：禁用评分阈值）
        echo "📂 检查 app/ 目录..."
        pylint app/ --fail-on=E --fail-under=0 --output-format=colorized --reports=yes --score=yes || true

        # 检查根目录的Python文件
        echo "📂 检查根目录 Python 文件..."
        for file in $(find . -name "*.py" -not -path "./.*" -not -path "./.venv/*" -not -path "./build/*" -not -path "./dist/*" -not -path "./tests/*" -not -path "./docs/*" -not -path "./__pycache__/*" -maxdepth 1); do
          echo "检查文件: $file"
          pylint "$file" --fail-on=E --fail-under=0 --output-format=colorized || true
        done

        # 生成详细报告
        echo "📊 生成 Pylint 详细报告..."
        pylint app/ --output-format=json > pylint-report.json || true

        # 显示评分（仅供参考）
        echo "📈 Pylint 评分（仅供参考）:"
        pylint app/ --score=yes --reports=no | tail -2 || true

    - name: Upload pylint report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pylint-report
        path: pylint-report.json

    - name: Summary
      run: |
        echo "🎉 Pylint 检查完成（报告模式）！"
        echo "📊 检查结果与详细报告已保存为构建工件"